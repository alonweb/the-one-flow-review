<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exact Vote Options</title>
<style>body{visibility:hidden}</style>
<script src="gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..800&family=Barlow:wght@500;600;700;800&display=swap">
<!-- Throwaway mockups (2026-10-25): six ways to set the crowd's exact vote in one move. Each sets the range and the exact % together. -->
<style>
:root { --bg: #07030a; --plum: #1c0913; --plum-2: #2a0f1e; --plum-3: #3a1529; --ink: #fff4f8; --ink-2: rgba(255, 244, 248, .8); --ink-3: rgba(255, 244, 248, .62);
  --pink: #ff2e8b; --pink-deep: #c2186a; --pink-ink: #1a0610; --gold: #f5b849; --gold-ink: #1a1205; --line: rgba(255, 255, 255, .12); --line-2: rgba(255, 255, 255, .22);
  --zof: #8fb7d9; --display: "Anton", Impact, sans-serif; --label: "Barlow", system-ui, sans-serif; --ui: "Inter", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: radial-gradient(900px 600px at 50% 0%, #2a0a1b, #07030a 70%) fixed, #07030a; color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
main { max-width: 420px; margin: 0 auto; padding: 22px 16px 60px; }
h1 { margin: 0; font: 400 30px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.lead { margin: 8px 0 22px; font: 400 14px/1.45 var(--ui); color: var(--ink-2); }
.opt { margin: 0 0 30px; }
.oh { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
.oh b { font: 400 22px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.oh .pick { font: 800 10px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); background: var(--gold); padding: 4px 7px; border-radius: 999px; }
.od { margin: 0 2px 10px; font: 400 13px/1.4 var(--ui); color: var(--ink-3); }
.card { border-radius: 24px; padding: 14px 14px 12px; background: linear-gradient(180deg, #3a1529, #22091a); border: 1px solid rgba(245, 184, 73, .45); box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .9); }
.qh { display: flex; align-items: center; gap: 10px; }
.qh .face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(245, 184, 73, .5); }
.qh .face img, .tug img, .fill img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
.qh small { display: block; font: 700 10.5px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.qh b { display: block; margin-top: 3px; font: 400 21px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.ctl { margin: 16px 0 8px; touch-action: none; user-select: none; -webkit-user-select: none; }
.ro { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; margin-top: 6px; }
.ro .side { font: 600 12px/1.2 var(--ui); color: var(--ink-3); }
.ro .side.r { text-align: right; }
.ro .side i { display: block; font: 800 15px/1 var(--label); font-style: normal; color: var(--ink); }
.ro .side.r i { color: var(--pink); }
.big { font: 400 46px/1 var(--display); letter-spacing: .01em; text-align: center; min-width: 110px; }
.big small { font-size: 24px; color: var(--ink-3); margin-left: 2px; }
.big.unset { color: var(--ink-3); }
.big.bump { animation: bump .25s ease-out; }
@keyframes bump { 50% { transform: scale(1.08); } }
.bands { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-top: 10px; }
.bands span { text-align: center; padding: 6px 0; border-radius: 10px; font: 400 14px/1 var(--display); letter-spacing: .02em; color: var(--ink-3); background: rgba(255, 255, 255, .04); border: 1px solid var(--line); transition: all .15s; }
.bands span.on { color: var(--pink-ink); background: var(--pink); border-color: var(--pink); box-shadow: 0 0 14px rgba(255, 46, 139, .5); }
.save { display: block; width: 100%; margin-top: 12px; min-height: 48px; border: 0; border-radius: 999px; font: 400 21px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--gold-ink); background: linear-gradient(135deg, #ffd27a, var(--gold) 50%, #c98b1f); box-shadow: 0 10px 26px -10px rgba(245, 184, 73, .8); cursor: pointer; }
.save:disabled { color: var(--ink-3); background: rgba(255, 255, 255, .07); box-shadow: none; }
.save.done { background: var(--pink); color: var(--pink-ink); }
.hint { text-align: center; font: 600 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }

/* A · split the crowd */
.tug { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.tug .fc { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
.tug .fc.l { box-shadow: 0 0 0 2px var(--zof); } .tug .fc.r { box-shadow: 0 0 0 2px var(--pink), 0 0 12px rgba(255, 46, 139, .6); }
.bar { position: relative; height: 58px; border-radius: 16px; overflow: hidden; background: rgba(143, 183, 217, .22); cursor: ew-resize; }
.bar .mf { position: absolute; top: 0; bottom: 0; right: 0; width: 63%; background: linear-gradient(90deg, #ff5ea6, var(--pink) 40%, var(--pink-deep)); }
.bar .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, .18); }
.bar .half { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: rgba(255, 255, 255, .45); }
.bar .half::after { content: "50"; position: absolute; top: 3px; left: 4px; font: 700 9px/1 var(--label); color: rgba(255, 255, 255, .6); }
.bar .knob { position: absolute; top: 4px; bottom: 4px; width: 10px; margin-left: -5px; border-radius: 6px; background: #fff; box-shadow: 0 0 12px rgba(255, 255, 255, .7); }
.bar .crowd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: flex-end; gap: 0; padding-right: 8px; pointer-events: none; }
.bar .crowd img { width: 22px; height: 22px; border-radius: 50%; margin-left: -6px; box-shadow: 0 0 0 2px var(--pink-deep); }

/* B · fill her photo */
.fillrow { display: grid; grid-template-columns: 1fr 70px; gap: 10px; align-items: stretch; }
.fill { position: relative; height: 250px; border-radius: 18px; overflow: hidden; cursor: ns-resize; box-shadow: 0 0 0 2px var(--pink), 0 0 18px rgba(255, 46, 139, .45); }
.fill .lvl { position: absolute; left: 0; right: 0; bottom: 0; height: 63%; background: linear-gradient(to top, rgba(255, 46, 139, .6), rgba(255, 46, 139, .16)); }
.fill .line { position: absolute; left: 0; right: 0; bottom: 63%; height: 3px; background: #fff; box-shadow: 0 0 10px #fff; }
.fill .line span { position: absolute; right: 8px; top: -30px; font: 400 24px/1 var(--display); text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
.fill .mid { position: absolute; left: 0; right: 0; bottom: 50%; border-top: 1.5px dashed rgba(255, 255, 255, .55); }
.fill .mid::after { content: "half"; position: absolute; left: 8px; top: 2px; font: 700 10px/1 var(--label); letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, .8); }
.fill .nm { position: absolute; left: 10px; top: 10px; font: 400 22px/1 var(--display); text-transform: uppercase; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); }
.zstrip { position: relative; border-radius: 14px; overflow: hidden; background: rgba(143, 183, 217, .15); }
.zstrip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; opacity: .55; }
.zstrip span { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font: 800 12px/1.2 var(--label); text-shadow: 0 1px 6px rgba(0, 0, 0, .8); }

/* C · hot meter */
.dial { display: block; width: 100%; height: auto; cursor: pointer; }
.dial .zone { fill: none; stroke-width: 22; }
.dial text { font: 700 10px var(--label); fill: rgba(255, 255, 255, .6); text-anchor: middle; }

/* D · zoned slider */
.sl { display: grid; grid-template-columns: 40px 1fr 40px; gap: 8px; align-items: center; }
.nud { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .06); color: var(--ink); font: 700 22px/1 var(--ui); cursor: pointer; touch-action: manipulation; }
.track { position: relative; height: 44px; cursor: pointer; }
.track .zones { position: absolute; left: 0; right: 0; top: 14px; height: 16px; display: flex; border-radius: 8px; overflow: hidden; }
.track .zones i { height: 100%; }
.track .thumb { position: absolute; top: 7px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 4px var(--pink), 0 0 16px rgba(255, 46, 139, .8); }
.track .zl { position: absolute; top: 34px; font: 700 9px/1 var(--label); color: var(--ink-3); transform: translateX(-50%); }

/* E · range tiles, middle picked for you */
.tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.tiles button { white-space: nowrap; padding: 0; min-height: 54px; border-radius: 14px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .05); color: var(--ink); font: 400 15px/1 var(--display); letter-spacing: 0; cursor: pointer; touch-action: manipulation; }
.tiles button.on { background: var(--pink); color: var(--pink-ink); border-color: var(--pink); box-shadow: 0 0 16px rgba(255, 46, 139, .55); }
.fine { display: none; grid-template-columns: 44px 1fr 44px; gap: 10px; align-items: center; margin-top: 12px; }
.fine.on { display: grid; }
.fine .mini { position: relative; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, .1); }
.fine .mini i { position: absolute; top: -6px; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px var(--pink); }

/* F · number wheel */
.wheelwrap { position: relative; display: grid; grid-template-columns: 1fr 120px 1fr; align-items: center; }
.wheel { height: 168px; overflow-y: scroll; scroll-snap-type: y mandatory; scrollbar-width: none; touch-action: pan-y; -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel div { height: 56px; display: grid; place-items: center; scroll-snap-align: center; font: 400 34px/1 var(--display); color: var(--ink-3); }
.wheel div.on { color: var(--ink); font-size: 44px; }
.wheel .pad { scroll-snap-align: none; }
.wheelwrap .sel { position: absolute; left: 50%; top: 50%; width: 120px; height: 56px; transform: translate(-50%, -50%); border-radius: 14px; border: 2px solid var(--pink); box-shadow: 0 0 14px rgba(255, 46, 139, .5); pointer-events: none; }
.wheelwrap .wl { font: 700 12px/1.3 var(--label); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); text-align: center; }
.wheelwrap .wl b { display: block; font: 400 18px/1 var(--display); letter-spacing: .02em; color: var(--pink); }
</style>
</head>
<body>
<main>
  <h1>Exact vote: six ways</h1>
  <p class="lead">You picked Mariana as the crowd's pick. Each mockup sets the range and the exact % together in one move, and scores the same as today. Try them with your finger.</p>
  <div id="opts"></div>
</main>
<script>
(function () {
  "use strict";
  var IMG = "img/", Z = "Zofia", M = "Mariana";
  var BANDS = [[51, 59], [60, 69], [70, 79], [80, 89], [90, 100]];
  var ZC = ["rgba(255,46,139,.35)", "rgba(255,46,139,.5)", "rgba(255,46,139,.65)", "rgba(255,46,139,.8)", "#ff2e8b"];
  function band(v) { return v >= 90 ? 4 : v >= 80 ? 3 : v >= 70 ? 2 : v >= 60 ? 1 : 0; }
  function clamp(v) { return Math.max(51, Math.min(100, Math.round(v))); }
  var CROWD = ["av-lion.jpg", "av-girl.jpg", "av-panda.jpg", "av-astro.jpg", "av-sun.jpg"];

  var OPTS = [
    { id: "split", t: "A · Split the crowd", pick: true, d: "Drag the line between them. The pink part is the crowd voting Mariana. One drag, then Save.", hint: "Drag along the bar" },
    { id: "fill", t: "B · Fill her photo", d: "Drag up or down on her photo. It fills to your guess, like a level.", hint: "Drag up or down on Mariana" },
    { id: "dial", t: "C · Hot meter", d: "Turn the needle from half to 100%. Game-like, one move.", hint: "Drag the needle" },
    { id: "slider", t: "D · Zoned slider", d: "Slide across the five ranges, then nudge with − and + for the exact number.", hint: "Slide, then − / +" },
    { id: "tiles", t: "E · Range, then done", d: "Tap a range: its middle is picked for you, so two taps are enough. Adjust only if you want.", hint: "Tap a range" },
    { id: "wheel", t: "F · Number wheel", d: "Flick to your number, like the iPhone time picker.", hint: "Flick up or down" }
  ];

  function head() { return '<div class="qh"><span class="face"><img src="' + IMG + 'mariana-portrait.jpg" alt=""></span><div><small>Exact vote · your guess</small><b>What % will vote ' + M + '?</b></div></div>'; }
  function foot(o) { return '<div class="ro"><span class="side">' + Z + '<i data-z>–</i></span><div class="big unset" data-big>–<small>%</small></div><span class="side r">' + M + '<i data-m>–</i></span></div>' +
    '<div class="bands">' + BANDS.map(function (b) { return '<span>' + b[0] + '–' + b[1] + '</span>'; }).join("") + '</div>' +
    '<button class="save" disabled>Save</button><div class="hint">' + o.hint + '</div>'; }

  var CTL = {
    split: function () {
      var ticks = [60, 70, 80, 90].map(function (n) { return '<i class="tick" style="left:' + (100 - n) + '%"></i>'; }).join("");
      return '<div class="tug"><span class="fc l"><img src="' + IMG + 'zofia-portrait.jpg" alt="Zofia"></span><div class="bar" data-drag><div class="mf"></div>' + ticks + '<div class="half"></div>' +
        '<div class="crowd">' + CROWD.map(function (a) { return '<img src="' + IMG + a + '" alt="">'; }).join("") + '</div><div class="knob"></div></div><span class="fc r"><img src="' + IMG + 'mariana-portrait.jpg" alt="Mariana"></span></div>';
    },
    fill: function () {
      return '<div class="fillrow"><div class="fill" data-drag><img src="' + IMG + 'mariana-02-at-first-sight-1.jpg" alt="Mariana"><div class="mid"></div><div class="lvl"></div><div class="line"><span></span></div><span class="nm">Mariana</span></div>' +
        '<div class="zstrip"><img src="' + IMG + 'zofia-02-at-first-sight-1.jpg" alt=""><span>Zofia<br><b data-zs>–</b></span></div></div>';
    },
    dial: function () {
      var cx = 150, cy = 150, r = 112, zones = "";
      function pt(v, rr) { var a = Math.PI * (1 - (v - 50) / 50); return [cx + rr * Math.cos(a), cy - rr * Math.sin(a)]; }
      BANDS.forEach(function (b, i) { var a = pt(i ? b[0] : 50, r), c = pt(b[1] + (i < 4 ? 1 : 0), r); zones += '<path class="zone" d="M' + a[0] + ' ' + a[1] + ' A' + r + ' ' + r + ' 0 0 1 ' + c[0] + ' ' + c[1] + '" stroke="' + ZC[i] + '"/>'; });
      var labels = [50, 60, 70, 80, 90, 100].map(function (n) { var p = pt(n, r + 22); return '<text x="' + p[0] + '" y="' + (p[1] + 3) + '">' + n + '</text>'; }).join("");
      return '<svg class="dial" viewBox="0 0 300 165" data-drag>' + zones + labels + '<line class="needle" x1="150" y1="150" x2="50" y2="150" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="150" r="12" fill="#fff"/><circle cx="150" cy="150" r="5" fill="#ff2e8b"/></svg>';
    },
    slider: function () {
      var zones = BANDS.map(function (b, i) { return '<i style="flex:' + (b[1] - b[0] + 1) + ';background:' + ZC[i] + '"></i>'; }).join("");
      var zl = [60, 70, 80, 90].map(function (n) { return '<span class="zl" style="left:' + ((n - 51) / 49 * 100) + '%">' + n + '</span>'; }).join("");
      return '<div class="sl"><button class="nud" data-d="-1" aria-label="Minus one">−</button><div class="track" data-drag><div class="zones">' + zones + '</div>' + zl + '<div class="thumb"></div></div><button class="nud" data-d="1" aria-label="Plus one">+</button></div>';
    },
    tiles: function () {
      return '<div class="tiles">' + BANDS.map(function (b, i) { return '<button data-i="' + i + '">' + b[0] + '–' + b[1] + '</button>'; }).join("") + '</div>' +
        '<div class="fine"><button class="nud" data-d="-1" aria-label="Minus one">−</button><div class="mini"><i></i></div><button class="nud" data-d="1" aria-label="Plus one">+</button></div>';
    },
    wheel: function () {
      var rows = '<div class="pad"></div>'; for (var n = 51; n <= 100; n++) rows += '<div data-n="' + n + '">' + n + '</div>'; rows += '<div class="pad"></div>';
      return '<div class="wheelwrap"><span class="wl">Range<b data-wr>–</b></span><div class="wheel">' + rows + '</div><span class="wl">' + M + '<b>%</b></span><span class="sel"></span></div>';
    }
  };

  var root = document.getElementById("opts");
  OPTS.forEach(function (o) {
    var s = document.createElement("section"); s.className = "opt";
    s.innerHTML = '<div class="oh"><b>' + o.t + '</b>' + (o.pick ? '<span class="pick">My pick</span>' : '') + '</div><p class="od">' + o.d + '</p>' +
      '<div class="card" data-o="' + o.id + '">' + head() + '<div class="ctl">' + CTL[o.id]() + '</div>' + foot(o) + '</div>';
    root.appendChild(s);
    wire(s.querySelector(".card"), o.id);
  });

  function wire(card, id) {
    var v = null;
    function set(nv, quiet) {
      nv = clamp(nv); if (nv === v) return; v = nv;
      var big = card.querySelector("[data-big]"); big.className = "big"; big.innerHTML = v + "<small>%</small>"; if (!quiet) { void big.offsetWidth; big.classList.add("bump"); }
      card.querySelector("[data-z]").textContent = (100 - v) + "%"; card.querySelector("[data-m]").textContent = v + "%";
      card.querySelectorAll(".bands span").forEach(function (b, i) { b.classList.toggle("on", i === band(v)); });
      var sv = card.querySelector(".save"); sv.disabled = false; sv.classList.remove("done"); sv.textContent = "Save " + v + "%";
      draw(v);
    }
    function draw(v) {
      if (id === "split") { card.querySelector(".mf").style.width = v + "%"; card.querySelector(".knob").style.left = (100 - v) + "%"; }
      if (id === "fill") { card.querySelector(".lvl").style.height = v + "%"; card.querySelector(".line").style.bottom = v + "%"; card.querySelector(".line span").textContent = v + "%"; card.querySelector("[data-zs]").textContent = (100 - v) + "%"; }
      if (id === "dial") { var a = Math.PI * (1 - (v - 50) / 50); var n = card.querySelector(".needle"); n.setAttribute("x2", 150 + 100 * Math.cos(a)); n.setAttribute("y2", 150 - 100 * Math.sin(a)); }
      if (id === "slider") card.querySelector(".thumb").style.left = ((v - 51) / 49 * 100) + "%";
      if (id === "tiles") { var b = BANDS[band(v)]; card.querySelectorAll(".tiles button").forEach(function (x, i) { x.classList.toggle("on", i === band(v)); }); card.querySelector(".fine").classList.add("on"); card.querySelector(".mini i").style.left = ((v - b[0]) / Math.max(1, b[1] - b[0]) * 100) + "%"; }
      if (id === "wheel") { card.querySelector("[data-wr]").textContent = BANDS[band(v)][0] + "–" + BANDS[band(v)][1]; card.querySelectorAll(".wheel [data-n]").forEach(function (x) { x.classList.toggle("on", +x.dataset.n === v); }); }
    }
    function fromPoint(e) {
      var el = card.querySelector("[data-drag]"), r = el.getBoundingClientRect();
      if (id === "split") return 100 - (e.clientX - r.left) / r.width * 100;
      if (id === "fill") return 100 - (e.clientY - r.top) / r.height * 100;
      if (id === "slider") return 51 + (e.clientX - r.left) / r.width * 49;
      if (id === "dial") { var sx = r.width / 300, cx = r.left + 150 * sx, cy = r.top + 150 * sx; var a = Math.atan2(cy - e.clientY, e.clientX - cx); if (a < 0) a = e.clientX < cx ? Math.PI : 0; return 50 + (1 - a / Math.PI) * 50; }
    }
    var dragEl = card.querySelector("[data-drag]");
    if (dragEl) {
      dragEl.addEventListener("pointerdown", function (e) { e.preventDefault(); try { dragEl.setPointerCapture(e.pointerId); } catch (x) {} dragEl._d = true; set(fromPoint(e)); });
      dragEl.addEventListener("pointermove", function (e) { if (dragEl._d) set(fromPoint(e), true); });
      dragEl.addEventListener("pointerup", function () { dragEl._d = false; });
      dragEl.addEventListener("pointercancel", function () { dragEl._d = false; });
    }
    card.querySelectorAll(".nud").forEach(function (b) { b.addEventListener("click", function () {
      var d = +b.dataset.d, base = v == null ? 65 : v, nv = base + d;
      if (id === "tiles" && v != null) { var r = BANDS[band(v)]; nv = Math.max(r[0], Math.min(r[1], nv)); }
      set(nv);
    }); });
    card.querySelectorAll(".tiles button").forEach(function (b) { b.addEventListener("click", function () { var r = BANDS[+b.dataset.i]; set(Math.round((r[0] + r[1]) / 2)); }); });
    if (id === "wheel") {
      var w = card.querySelector(".wheel");
      function start() { w.scrollTop = 14 * 56; } start(); setTimeout(start, 50); // starts showing 65, nothing chosen until you move it
      var moved = false;
      w.addEventListener("scroll", function () { if (moved) set(51 + Math.round(w.scrollTop / 56), true); });
      w.addEventListener("touchstart", function () { moved = true; }, { passive: true });
      w.addEventListener("wheel", function () { moved = true; }, { passive: true });
      w.addEventListener("pointerdown", function () { moved = true; });
    }
    card.querySelector(".save").addEventListener("click", function () { var sv = this; sv.classList.add("done"); sv.textContent = "Saved ✓ " + v + "% · range " + BANDS[band(v)][0] + "–" + BANDS[band(v)][1]; });
  }
})();
</script>
</body>
</html>
