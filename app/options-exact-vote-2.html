<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exact Vote Round 2</title>
<style>body{visibility:hidden}</style>
<script src="gate.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400..800&family=Barlow:wght@500;600;700;800&display=swap">
<!-- Throwaway mockups, round 2 (2026-10-25): no ranges, one number from 51 to 100%, one simple move. -->
<style>
:root { --ink: #fff4f8; --ink-2: rgba(255, 244, 248, .8); --ink-3: rgba(255, 244, 248, .62); --line: rgba(255, 255, 255, .12); --line-2: rgba(255, 255, 255, .22);
  --pink: #ff2e8b; --pink-deep: #c2186a; --pink-ink: #1a0610; --gold: #f5b849; --gold-ink: #1a1205; --zof: #8fb7d9;
  --display: "Anton", Impact, sans-serif; --label: "Barlow", system-ui, sans-serif; --ui: "Inter", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; background: radial-gradient(900px 600px at 50% 0%, #2a0a1b, #07030a 70%) fixed, #07030a; color: var(--ink); font-family: var(--ui); -webkit-tap-highlight-color: transparent; }
main { max-width: 420px; margin: 0 auto; padding: 22px 16px 60px; }
h1 { margin: 0; font: 400 30px/1.05 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.lead { margin: 8px 0 22px; font: 400 14px/1.45 var(--ui); color: var(--ink-2); }
.opt { margin: 0 0 30px; }
.oh { display: flex; align-items: baseline; gap: 8px; margin: 0 2px 8px; }
.oh b { font: 400 22px/1 var(--display); letter-spacing: .03em; text-transform: uppercase; }
.oh .pick { font: 800 10px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--gold-ink); background: var(--gold); padding: 4px 7px; border-radius: 999px; }
.od { margin: 0 2px 10px; font: 400 13px/1.4 var(--ui); color: var(--ink-3); }
.card { border-radius: 24px; padding: 14px 14px 12px; background: linear-gradient(180deg, #3a1529, #22091a); border: 1px solid rgba(245, 184, 73, .45); box-shadow: 0 20px 40px -20px rgba(0, 0, 0, .9); overflow: hidden; }
.qh { display: flex; align-items: center; gap: 10px; }
.qh .face { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: none; box-shadow: 0 0 0 2px var(--gold), 0 0 12px rgba(245, 184, 73, .5); }
.qh img, .vs2 img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
.qh small { display: block; font: 700 10.5px/1 var(--label); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.qh b { display: block; margin-top: 3px; font: 400 21px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.ctl { margin: 14px 0 6px; user-select: none; -webkit-user-select: none; }
.ro { display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; }
.ro .side { font: 600 12px/1.2 var(--ui); color: var(--ink-3); }
.ro .side.r { text-align: right; }
.ro .side i { display: block; font: 800 15px/1 var(--label); font-style: normal; color: var(--ink); }
.ro .side.r i { color: var(--pink); }
.big { font: 400 50px/1 var(--display); letter-spacing: .01em; text-align: center; min-width: 120px; }
.big small { font-size: 26px; color: var(--ink-3); margin-left: 2px; }
.big.unset { color: var(--ink-3); }
.save { display: block; width: 100%; margin-top: 12px; min-height: 48px; border: 0; border-radius: 999px; font: 400 21px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--gold-ink); background: linear-gradient(135deg, #ffd27a, var(--gold) 50%, #c98b1f); box-shadow: 0 10px 26px -10px rgba(245, 184, 73, .8); cursor: pointer; }
.save:disabled { color: var(--ink-3); background: rgba(255, 255, 255, .07); box-shadow: none; }
.save.done { background: var(--pink); color: var(--pink-ink); }
.hint { text-align: center; font: 600 11px/1 var(--label); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-top: 8px; }

/* A · ruler that scrolls under a fixed pin */
.rulerwrap { position: relative; height: 74px; }
.ruler { position: absolute; inset: 0; overflow-x: scroll; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; -webkit-mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); mask-image: linear-gradient(90deg, transparent, #000 22%, #000 78%, transparent); }
.ruler::-webkit-scrollbar { display: none; }
.ruler .strip { position: relative; height: 100%; display: flex; align-items: flex-start; }
.ruler .t { flex: none; width: 12px; height: 100%; position: relative; scroll-snap-align: center; }
.ruler .t::before { content: ""; position: absolute; left: 50%; top: 8px; width: 2px; height: 14px; margin-left: -1px; border-radius: 1px; background: rgba(255, 255, 255, .3); }
.ruler .t.m5::before { height: 22px; background: rgba(255, 255, 255, .5); }
.ruler .t.m10::before { height: 32px; background: #fff; }
.ruler .t b { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); font: 400 15px/1 var(--display); color: var(--ink-3); }
.ruler .pad { flex: none; }
.pin { position: absolute; left: 50%; top: 0; width: 4px; height: 44px; margin-left: -2px; border-radius: 2px; background: var(--pink); box-shadow: 0 0 12px var(--pink); pointer-events: none; }
.pin::after { content: ""; position: absolute; left: 50%; top: -6px; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--pink); }

/* B · a simple line */
.line { position: relative; height: 70px; touch-action: none; cursor: pointer; }
.line .rail { position: absolute; left: 14px; right: 14px; top: 42px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); }
.line .fillr { position: absolute; left: 14px; top: 42px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--pink-deep), var(--pink)); }
.line .dot { position: absolute; top: 30px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 5px rgba(255, 46, 139, .55), 0 0 18px rgba(255, 46, 139, .8); }
.line .tip { position: absolute; top: 0; padding: 4px 8px; border-radius: 9px; transform: translateX(-50%); background: var(--pink); color: var(--pink-ink); font: 400 16px/1 var(--display); white-space: nowrap; }
.line .tip.off { visibility: hidden; }
.line .end { position: absolute; top: 54px; font: 700 10px/1 var(--label); color: var(--ink-3); }
.line .end.l { left: 6px; } .line .end.r { right: 4px; }

/* C · slide the VS between their photos */
.vs2 { position: relative; height: 230px; border-radius: 18px; overflow: hidden; touch-action: none; cursor: ew-resize; background: #000; }
.vs2 .pz, .vs2 .pm { position: absolute; top: 0; bottom: 0; overflow: hidden; }
.vs2 .pz { left: 0; } .vs2 .pm { right: 0; }
.vs2 .pz img, .vs2 .pm img { position: absolute; top: 0; height: 100%; width: 340px; max-width: none; }
.vs2 .pz img, .vs2 .pm img { left: 50%; transform: translateX(-50%); } /* each face stays in the middle of her side */
.vs2 .pm::after { content: ""; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px var(--pink); border-radius: 0 18px 18px 0; }
.vs2 .lab { position: absolute; bottom: 10px; font: 400 26px/1 var(--display); text-shadow: 0 2px 10px rgba(0, 0, 0, .8); }
.vs2 .pz .lab { left: 10px; } .vs2 .pm .lab { right: 10px; color: #fff; }
.vs2 .lab small { display: block; font: 700 10px/1 var(--label); letter-spacing: .12em; text-transform: uppercase; margin-top: 3px; }
.vs2 .knob { position: absolute; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle at 50% 38%, #3a1529, #12050c); border: 2px solid var(--pink); box-shadow: 0 0 18px rgba(255, 46, 139, .8); font: 400 18px/1 var(--display); color: #fff; }
.vs2 .knob::before, .vs2 .knob::after { content: "‹"; position: absolute; left: -16px; font: 700 18px/1 var(--ui); color: #fff; text-shadow: 0 1px 6px #000; }
.vs2 .knob::after { content: "›"; left: auto; right: -16px; }
.vs2 .seam { position: absolute; top: 0; bottom: 0; width: 3px; margin-left: -1.5px; background: #fff; box-shadow: 0 0 10px rgba(255, 255, 255, .8); }

/* D · drag the number */
.scrub { position: relative; display: grid; place-items: center; height: 150px; border-radius: 18px; background: rgba(255, 255, 255, .04); border: 1px dashed var(--line-2); touch-action: none; cursor: ns-resize; }
.scrub .num { font: 400 86px/1 var(--display); letter-spacing: .01em; }
.scrub .num small { font-size: 40px; color: var(--ink-3); }
.scrub .num.unset { color: var(--ink-3); }
.scrub .ar { position: absolute; left: 50%; transform: translateX(-50%); width: 44px; height: 30px; border: 0; background: none; color: var(--pink); font: 700 22px/1 var(--ui); cursor: pointer; touch-action: manipulation; }
.scrub .ar.up { top: 4px; } .scrub .ar.dn { bottom: 4px; }
.scrub .who { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font: 700 10px/1.3 var(--label); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }

/* E · split the crowd (round 1's A, without ranges) */
.tug { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; }
.tug .fc { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
.tug .fc img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; display: block; }
.tug .fc.l { box-shadow: 0 0 0 2px var(--zof); } .tug .fc.r { box-shadow: 0 0 0 2px var(--pink), 0 0 12px rgba(255, 46, 139, .6); }
.bar { position: relative; height: 58px; border-radius: 16px; overflow: hidden; background: rgba(143, 183, 217, .22); touch-action: none; cursor: ew-resize; }
.bar .mf { position: absolute; top: 0; bottom: 0; right: 0; width: 51%; background: linear-gradient(90deg, #ff5ea6, var(--pink) 40%, var(--pink-deep)); }
.bar .half { position: absolute; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: rgba(255, 255, 255, .45); }
.bar .knob { position: absolute; top: 4px; bottom: 4px; left: 49%; width: 10px; margin-left: -5px; border-radius: 6px; background: #fff; box-shadow: 0 0 12px rgba(255, 255, 255, .7); }
</style>
</head>
<body>
<main>
  <h1>Exact vote: round 2</h1>
  <p class="lead">No ranges: just one number from 51 to 100%, the share of the crowd you think votes Mariana. Five ways to set it in one move. Try them with your finger.</p>
  <div id="opts"></div>
</main>
<script>
(function () {
  "use strict";
  var IMG = "img/", Z = "Zofia", M = "Mariana", MIN = 51, MAX = 100;
  function clamp(v) { return Math.max(MIN, Math.min(MAX, Math.round(v))); }
  var OPTS = [
    { id: "ruler", t: "A · Scroll the ruler", pick: true, d: "Swipe the ruler left or right under the pink pin, like a tape measure. It clicks from number to number.", hint: "Swipe the ruler" },
    { id: "line", t: "B · One line", d: "A single line from 51 to 100. Drag the dot, or tap anywhere on the line.", hint: "Drag the dot" },
    { id: "vs", t: "C · Slide the VS", d: "Their two photos are the control: drag the VS and Mariana’s side grows to your number.", hint: "Drag the VS sideways" },
    { id: "scrub", t: "D · Drag the number", d: "Just the number. Drag up or down on it, or tap the arrows for one point at a time.", hint: "Drag up or down" },
    { id: "split", t: "E · Split the crowd", d: "From round 1, without ranges: drag the white line, the pink part is the crowd voting Mariana.", hint: "Drag along the bar" }
  ];
  function head() { return '<div class="qh"><span class="face"><img src="' + IMG + 'mariana-portrait.jpg" alt=""></span><div><small>Exact vote · your guess</small><b>What % will vote ' + M + '?</b></div></div>'; }
  function foot(o, plain) { return (plain ? '' : '<div class="ro"><span class="side">' + Z + '<i data-z>–</i></span><div class="big unset" data-big>–<small>%</small></div><span class="side r">' + M + '<i data-m>–</i></span></div>') +
    '<button class="save" disabled>Save</button><div class="hint">' + o.hint + '</div>'; }
  var CTL = {
    ruler: function () {
      var t = ""; for (var n = MIN; n <= MAX; n++) t += '<span class="t' + (n % 10 === 0 ? " m10" : n % 5 === 0 ? " m5" : "") + '" data-n="' + n + '">' + (n % 10 === 0 || n === MIN ? "<b>" + n + "</b>" : "") + '</span>';
      return '<div class="rulerwrap"><div class="ruler"><div class="strip"><span class="pad"></span>' + t + '<span class="pad"></span></div></div><span class="pin"></span></div>';
    },
    line: function () { return '<div class="line" data-drag><span class="rail"></span><span class="fillr"></span><span class="tip off"></span><span class="dot" style="left:14px"></span><span class="end l">51</span><span class="end r">100</span></div>'; },
    vs: function () {
      return '<div class="vs2" data-drag><div class="pz"><img src="' + IMG + 'zofia-02-at-first-sight-1.jpg" alt="Zofia"><span class="lab">49%<small>Zofia</small></span></div>' +
        '<div class="pm"><img src="' + IMG + 'mariana-02-at-first-sight-1.jpg" alt="Mariana"><span class="lab">51%<small>Mariana</small></span></div><span class="seam"></span><span class="knob">VS</span></div>';
    },
    scrub: function () { return '<div class="scrub" data-drag><button class="ar up" aria-label="Plus one">▲</button><div class="num unset" data-num>–<small>%</small></div><button class="ar dn" aria-label="Minus one">▼</button><span class="who">' + M + '</span></div>'; },
    split: function () {
      return '<div class="tug"><span class="fc l"><img src="' + IMG + 'zofia-portrait.jpg" alt="Zofia"></span><div class="bar" data-drag><div class="mf"></div><div class="half"></div><div class="knob"></div></div><span class="fc r"><img src="' + IMG + 'mariana-portrait.jpg" alt="Mariana"></span></div>';
    }
  };
  var root = document.getElementById("opts");
  OPTS.forEach(function (o) {
    var s = document.createElement("section"); s.className = "opt";
    s.innerHTML = '<div class="oh"><b>' + o.t + '</b>' + (o.pick ? '<span class="pick">My pick</span>' : '') + '</div><p class="od">' + o.d + '</p>' +
      '<div class="card" data-o="' + o.id + '">' + head() + '<div class="ctl">' + CTL[o.id]() + '</div>' + foot(o, o.id === "scrub") + '</div>';
    root.appendChild(s); wire(s.querySelector(".card"), o.id);
  });

  function wire(card, id) {
    var v = null;
    function set(nv) {
      nv = clamp(nv); if (nv === v) return; v = nv;
      var big = card.querySelector("[data-big]"); if (big) { big.className = "big"; big.innerHTML = v + "<small>%</small>"; card.querySelector("[data-z]").textContent = (100 - v) + "%"; card.querySelector("[data-m]").textContent = v + "%"; }
      var sv = card.querySelector(".save"); sv.disabled = false; sv.classList.remove("done"); sv.textContent = "Save " + v + "%";
      draw();
    }
    function draw() {
      if (id === "line") { var r = card.querySelector(".rail"), w = r.offsetWidth, x = 14 + (v - MIN) / (MAX - MIN) * w; card.querySelector(".dot").style.left = x + "px"; card.querySelector(".fillr").style.width = (x - 14) + "px"; var tp = card.querySelector(".tip"); tp.classList.remove("off"); tp.style.left = x + "px"; tp.textContent = v + "%"; }
      if (id === "vs") { var box = card.querySelector(".vs2"), bw = box.offsetWidth, zx = (100 - v) / 100 * bw; card.querySelector(".pz").style.width = zx + "px"; card.querySelector(".pm").style.width = (bw - zx) + "px"; card.querySelector(".seam").style.left = zx + "px"; card.querySelector(".knob").style.left = zx + "px";
        card.querySelector(".pz .lab").innerHTML = (100 - v) + "%<small>Zofia</small>"; card.querySelector(".pm .lab").innerHTML = v + "%<small>Mariana</small>"; card.querySelector(".pz .lab").style.visibility = 100 - v < 12 ? "hidden" : ""; }
      if (id === "scrub") { var n = card.querySelector("[data-num]"); n.className = "num"; n.innerHTML = v + "<small>%</small>"; }
      if (id === "split") { card.querySelector(".mf").style.width = v + "%"; card.querySelector(".knob").style.left = (100 - v) + "%"; }
    }
    var d = card.querySelector("[data-drag]");
    function fromPoint(e) {
      var r = d.getBoundingClientRect();
      if (id === "line") return MIN + (e.clientX - r.left - 14) / (r.width - 28) * (MAX - MIN);
      if (id === "vs" || id === "split") return 100 - (e.clientX - r.left) / r.width * 100;
    }
    if (d && id !== "scrub") {
      d.addEventListener("pointerdown", function (e) { e.preventDefault(); try { d.setPointerCapture(e.pointerId); } catch (x) {} d._on = true; set(fromPoint(e)); });
      d.addEventListener("pointermove", function (e) { if (d._on) set(fromPoint(e)); });
      d.addEventListener("pointerup", function () { d._on = false; }); d.addEventListener("pointercancel", function () { d._on = false; });
    }
    if (id === "scrub") { // drag up or down: 7 px per point
      var y0 = 0, v0 = 0;
      d.addEventListener("pointerdown", function (e) { if (e.target.closest(".ar")) return; e.preventDefault(); try { d.setPointerCapture(e.pointerId); } catch (x) {} d._on = true; y0 = e.clientY; v0 = v == null ? 70 : v; if (v == null) set(70); });
      d.addEventListener("pointermove", function (e) { if (d._on) set(v0 + (y0 - e.clientY) / 7); });
      d.addEventListener("pointerup", function () { d._on = false; }); d.addEventListener("pointercancel", function () { d._on = false; });
      card.querySelector(".ar.up").addEventListener("click", function () { set((v == null ? 69 : v) + 1); });
      card.querySelector(".ar.dn").addEventListener("click", function () { set((v == null ? 71 : v) - 1); });
    }
    if (id === "ruler") {
      var ru = card.querySelector(".ruler"), moved = false;
      function pads() { var half = ru.clientWidth / 2 - 6; card.querySelectorAll(".ruler .pad").forEach(function (p) { p.style.width = half + "px"; }); }
      pads(); ru.scrollLeft = (70 - MIN) * 12; setTimeout(function () { pads(); ru.scrollLeft = (70 - MIN) * 12; }, 60); // opens on 70, nothing chosen until you move it
      ["touchstart", "pointerdown", "wheel"].forEach(function (ev) { ru.addEventListener(ev, function () { moved = true; }, { passive: true }); });
      ru.addEventListener("scroll", function () { if (moved) set(MIN + Math.round(ru.scrollLeft / 12)); });
      card.querySelectorAll(".ruler .t").forEach(function (t) { t.addEventListener("click", function () { moved = true; ru.scrollTo({ left: (+t.dataset.n - MIN) * 12, behavior: "smooth" }); }); });
    }
    if (id === "vs") { v = null; var keep = v; v = -1; set(51); v = null; card.querySelector(".save").disabled = true; card.querySelector(".save").textContent = "Save"; var big = card.querySelector("[data-big]"); big.className = "big unset"; big.innerHTML = "–<small>%</small>"; card.querySelector("[data-z]").textContent = "–"; card.querySelector("[data-m]").textContent = "–"; }
    card.querySelector(".save").addEventListener("click", function () { this.classList.add("done"); this.textContent = "Saved ✓ " + v + "%"; });
  }
})();
</script>
</body>
</html>
